spring:
  application:
    name: nextune-backend

  datasource:
    url: jdbc:mysql://localhost:3306/nextune_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: nextune_user
    password: nextune@123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8082

jwt:
  secret: nextune_super_secret_jwt_key_2024_make_this_long_and_secure
  expiration: 86400000

file:
  upload-dir: ./uploads

logging:
  level:
    com.nextune: DEBUG
    org.springframework.security: DEBUG